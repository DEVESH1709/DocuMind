<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080d1a"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#111c38"/>
    </linearGradient>

    <!-- Glowing Border Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>

    <!-- Document Fill Gradient -->
    <linearGradient id="docGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <!-- AI Sparkle Core Gradient -->
    <linearGradient id="sparkleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="45%" stop-color="#67e8f9"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>

    <!-- Accent Neural Gradient -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Modern Rounded Squircle Container -->
  <rect x="4" y="4" width="120" height="120" rx="32" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="4"/>

  <!-- Subtle Inner Backdrop Glow -->
  <circle cx="64" cy="64" r="38" fill="#3b82f6" fill-opacity="0.12" filter="url(#glow)"/>

  <!-- Document Silhouette -->
  <path d="M36 28 C36 23.58 39.58 20 44 20 H74 L92 38 V98 C92 102.42 88.42 106 84 106 H44 C39.58 106 36 102.42 36 98 Z" 
        fill="url(#docGrad)" stroke="url(#borderGrad)" stroke-width="4" stroke-linejoin="round"/>

  <!-- Folded Corner -->
  <path d="M74 20 V36 C74 37.1 74.9 38 76 38 H92" 
        stroke="url(#borderGrad)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="#1e293b"/>

  <!-- Abstract Document Text / Media Lines -->
  <rect x="46" y="44" width="22" height="4" rx="2" fill="#60a5fa" fill-opacity="0.9"/>
  <rect x="46" y="54" width="34" height="4" rx="2" fill="#94a3b8" fill-opacity="0.7"/>
  <rect x="46" y="64" width="18" height="4" rx="2" fill="#94a3b8" fill-opacity="0.5"/>

  <!-- Central AI Neural Sparkle (High Contrast, Bold, Glowing) -->
  <path d="M74 62 Q74 76 60 76 Q74 76 74 90 Q74 76 88 76 Q74 76 74 62 Z" 
        fill="url(#sparkleGrad)" filter="url(#glow)"/>

  <!-- Mini Accent Sparkle -->
  <path d="M50 82 Q50 87 45 87 Q50 87 50 92 Q50 87 55 87 Q50 87 50 82 Z" 
        fill="#38bdf8"/>

  <!-- Satellite Neural Nodes -->
  <circle cx="88" cy="62" r="3" fill="#67e8f9"/>
  <circle cx="62" cy="94" r="2.5" fill="#a855f7"/>
</svg>
